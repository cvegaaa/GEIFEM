<svg width="180" height="60" viewBox="0 0 180 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo hexagonal G -->
  <g transform="translate(10, 10)">
    <!-- Hexagon pieces in blue -->
    <path d="M20 5 L30 10 L30 20 L20 25 L10 20 L10 10 Z" fill="#003057" opacity="0.9"/>
    <path d="M5 15 L15 20 L15 30 L5 35 L-5 30 L-5 20 Z" fill="#1E5A75" opacity="0.8"/>
    <path d="M35 15 L45 20 L45 30 L35 35 L25 30 L25 20 Z" fill="#1E5A75" opacity="0.8"/>
    
    <!-- Gold accent pieces -->
    <path d="M30 25 L40 30 L40 35 L30 40 L20 35 L20 30 Z" fill="#CBA55A" opacity="0.9"/>
    <path d="M10 25 L20 30 L20 35 L10 40 L0 35 L0 30 Z" fill="#CBA55A" opacity="0.9"/>
    
    <!-- Letter G in center -->
    <text x="20" y="28" font-family="Montserrat, sans-serif" font-size="24" font-weight="700" fill="#CBA55A" text-anchor="middle">G</text>
  </g>
  
  <!-- Company name -->
  <text x="65" y="25" font-family="Montserrat, sans-serif" font-size="18" font-weight="700" fill="#003057">GEIFEM</text>
  
  <!-- Tagline -->
  <text x="65" y="43" font-family="Montserrat, sans-serif" font-size="9" fill="#666666">Gestión Integral para el</text>
  <text x="65" y="53" font-family="Montserrat, sans-serif" font-size="9" fill="#666666">Fortalecimiento Empresarial</text>
</svg>